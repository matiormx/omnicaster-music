[package]
name = "omnicaster-music"
version = "0.1.0"
description = "Reproductor de música de escritorio para bibliotecas Subsonic/OpenSubsonic"
authors = ["matiormx"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "omnicaster_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
md5 = "0.7"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
souvlaki = "0.8"
parking_lot = "0.12"
thiserror = "1"
urlencoding = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
