name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (clippy y tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema (WebKitGTK 4.1, ALSA…)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libsecret-1-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Carpeta de la interfaz (necesaria para compilar Tauri)
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test

  web:
    name: Interfaz (tsc, build y pruebas E2E)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E contra vite dev y el servidor falso
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: docs/capturas

  instaladores:
    name: Instaladores de prueba (${{ matrix.plataforma }})
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            args: '--bundles nsis,msi'
          - plataforma: ubuntu-22.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema (Linux)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libsecret-1-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Clippy y tests en esta plataforma
        working-directory: src-tauri
        run: |
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          cargo clippy --all-targets -- -D warnings
          cargo test
        shell: bash
      - name: Construir instaladores (sin firma de actualizaciones)
        run: npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NO_STRIP: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.plataforma }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
